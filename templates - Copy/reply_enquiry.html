<!DOCTYPE html>
<html>
<head>
    <title>Reply to Enquiry</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <h2>Reply to Enquiry from {{ enquiry[1] }}</h2>
    <p><strong>Email:</strong> {{ enquiry[2] }}</p>
    <p><strong>Subject:</strong> {{ enquiry[3] }}</p>
    <p><strong>Message:</strong> {{ enquiry[4] }}</p>

    <form method="POST">
        <label>Reply:</label><br>
        <textarea name="reply" rows="5" required>{{ enquiry[6] or '' }}</textarea><br><br>
        <button type="submit">Send Reply</button>
    </form>
</body>
</html>
